services:
  app:
    build: .
    image: induqora:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: file:/app/data/induqora.db
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
    volumes:
      - induqora-data:/app/data
    ports:
      # Bound to localhost only; public traffic goes through Caddy.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  induqora-data:
  caddy-data:
  caddy-config:
